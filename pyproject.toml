[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serverspace"
version = "1.0.0-alpha.1"
description = "Sovereign runtime architecture for custom local-first services and execution fabric"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Boost Software License 1.0" }
authors = [{ name = "Keddeh Systems" }]
keywords = ["runtime", "dns", "http", "https", "mesh", "custom-execution"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: System :: Networking",
]

dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]
